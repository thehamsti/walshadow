# Replace identifiers and paths before use. No Snowflake or AWS secret belongs here.
[destination]
kind = "snowflake"

[source]
host = "postgres.example.internal"
port = 5432
user = "walshadow_repl"
dbname = "app"
sslmode = "verify-full"
slot = "walshadow_snowflake"

[stream]
replicate_all = false

[bootstrap]
mode = "off"

[table.public.orders]
replicate = true
initial_load = "copy"

[snowflake]
account_url = "https://org-account.snowflakecomputing.com/"
user = "WALSHADOW_SERVICE"
role = "WALSHADOW_REPLICATOR"
warehouse = "WALSHADOW_WH"
database = "REPLICA_DB"
internal_schema = "WALSHADOW_INTERNAL"
channels_per_table = 8
max_in_flight = 16
batch_rows = 50000
batch_bytes = 8388608
flush_interval_ms = 250
merge_interval_ms = 15000
metadata_concurrency = 32

[snowflake.auth]
# OAuth refresh must atomically replace this file before the token expires.
method = "oauth"
token_file = "/run/secrets/walshadow/snowflake-oauth-token"
# For JWT instead:
# method = "jwt"
# account = "ORG-ACCOUNT"
# private_key_file = "/run/secrets/walshadow/snowflake-key.p8"
# public_key_fingerprint = "SHA256:..."

[snowflake.state]
# Durable, local, private storage; retain across daemon restarts.
directory = "/var/lib/walshadow/snowflake"
max_bytes = 10737418240

[snowflake.stage]
bucket = "replace-with-dedicated-bucket"
prefix = "walshadow/replica-db"
region = "us-east-2"
name = "REPLICA_DB.WALSHADOW_INTERNAL.WALSHADOW_STAGE"
